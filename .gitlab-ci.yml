# viet-text2sql-agent — GitLab CI.
#
# lint -> test -> security -> deploy(main only, over SSH)
#
# No image build, no registry, no Dockerfile in this repository. GitLab's shared runners happen
# to execute jobs inside containers on GitLab's own infrastructure — that is their implementation
# detail, and the developer never installs, configures or touches Docker. The no-Docker
# constraint is about this repo, the developer's machine and the deploy target; it is not
# violated by using a hosted CI service. See docs/DECISIONS.md.
#
# The deploy stage SSHes into the VPS, pulls, updates the venv and restarts two systemd units.
# There is nothing to push and nothing to pull from a registry.

stages: [lint, test, security, deploy]

default:
  image: python:3.11-slim
  cache:
    key:
      files: [pyproject.toml]
    paths: [.cache/pip]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Every CI job runs on fixtures: no API keys, no database, no network calls to a model provider.
  OFFLINE_MODE: "1"
  GIT_DEPTH: "20"

.python_setup: &python_setup
  before_script:
    - python -V
    - pip install --upgrade pip
    - pip install -e ".[dev]"

# ---------------------------------------------------------------------------
lint:
  stage: lint
  <<: *python_setup
  script:
    - ruff check .
    - ruff format --check .
    # The no-Docker constraint is enforced, not merely documented.
    # Two checks, both looking for container tooling that is actually USED. Prose that explains
    # the constraint ("no Docker anywhere") must not trip them, so this greps for artefacts and
    # invocations, never for the bare word.
    - |
      set -e
      found=$(find . -path ./.git -prune -o -path ./.venv -prune -o \( \
                -iname 'Dockerfile*' -o -iname '*.dockerfile' \
                -o -iname 'docker-compose*.yml' -o -iname 'docker-compose*.yaml' \
                -o -iname 'compose.y*ml' -o -name '.dockerignore' -o -name '.devcontainer' \
              \) -print)
      if [ -n "$found" ]; then
        echo "ERROR: container artefacts present — see docs/DECISIONS.md"; echo "$found"; exit 1
      fi
    - |
      set -e
      if grep -rnE '(^|[^[:alnum:]_-])(docker[[:space:]]+(run|build|compose|exec|pull|push)|docker-compose[[:space:]]|kubectl[[:space:]]|helm[[:space:]]+(install|upgrade|template))' \
           --include='*.py' --include='*.yml' --include='*.yaml' --include='*.toml' \
           --include='*.sh' --include='*.service' --include='Makefile' --include='Caddyfile' \
           --exclude-dir=.git --exclude-dir=.venv --exclude-dir=docs \
           --exclude='.gitlab-ci.yml' . ; then
        echo "ERROR: container tooling invoked outside docs/ — see docs/DECISIONS.md"; exit 1
      fi

# ---------------------------------------------------------------------------
test:
  stage: test
  <<: *python_setup
  script:
    # test_readonly_role.py skips with an explicit message here (no DATABASE_URL_RO on a runner).
    # That is expected and visible in the report; it never silently passes.
    - pytest -q --junitxml=report.xml
    - python -m eval.harness.runner --demo --offline
    - python -m eval.harness.runner --config eval/configs/baseline.yaml --offline
  artifacts:
    when: always
    reports:
      junit: report.xml
    paths: [eval/results/]
    expire_in: 1 week

# ---------------------------------------------------------------------------
security:
  stage: security
  <<: *python_setup
  script:
    # A distinct job on purpose: a red-team regression must be legible as a security failure in
    # the pipeline view, not buried among unit tests.
    - pytest -q tests/test_ast_policy.py tests/test_execute_tool_bypass.py tests/test_max_iterations.py
    - >
      python -c "
      import json, sys;
      sys.path.insert(0, 'src');
      from eval.harness.runner import run_security_suite, REPO_ROOT;
      from eval.harness.metrics import security_metrics;
      m = security_metrics(run_security_suite(REPO_ROOT / 'eval/datasets/security/attacks.jsonl'));
      print(json.dumps(m, indent=2));
      sys.exit(0 if m['pass_rate'] == 100.0 else 1)
      "

# ---------------------------------------------------------------------------
deploy:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    # SSH_PRIVATE_KEY, VPS_HOST, VPS_USER, SSH_KNOWN_HOSTS are protected+masked CI/CD variables.
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
      set -euo pipefail
      cd /opt/t2sql
      sudo -u t2sql git pull --ff-only
      sudo -u t2sql /opt/t2sql/.venv/bin/pip install -e . --quiet
      sudo systemctl restart t2sql-api t2sql-ui
      sleep 5
      curl -fsS localhost:8000/health
      REMOTE
  environment:
    name: production
    url: https://t2sql.example.com
