[project]
name = "viet-text2sql-agent"
version = "0.1.0"
description = "Bilingual (Vietnamese question -> English schema) Text-to-SQL analytics agent with database-level guardrails and a self-built evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MN" }]

dependencies = [
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.30,<0.36",
    "langgraph>=0.2.50,<0.7",
    "langchain-core>=0.3.20,<0.4",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<3.3",
    "sqlglot>=25.20,<27",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "plotly>=5.22,<7",
    "streamlit>=1.37,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2sql"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "eval/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
