# viet-text2sql-agent — CI/CD.
#
# lint -> test -> security -> deploy (main only, over SSH)
#
# No image build, no registry, no Dockerfile in this repository. GitHub-hosted runners are
# virtual machines, not containers, so nothing here contradicts the no-Docker constraint — and
# unlike a container-based runner, there is no container in the loop at all. The developer never
# installs, configures or touches Docker.
#
# The deploy job SSHes into the VPS, pulls, updates the venv and restarts two systemd units.
# There is nothing to push and nothing to pull from a registry.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push supersedes an in-flight run on the same ref — except on main, where the deploy
  # job must not be interrupted halfway through restarting services on the VPS.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Every CI job runs on fixtures: no API keys, no database, no calls to a model provider.
  OFFLINE_MODE: "1"

jobs:
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      # The no-Docker constraint is enforced, not merely documented.
      # Two checks, both looking for container tooling that is actually USED. Prose that explains
      # the constraint ("no Docker anywhere") must not trip them, so this greps for artefacts and
      # invocations, never for the bare word.
      - name: No container artefacts
        run: |
          found=$(find . -path ./.git -prune -o -path ./.venv -prune -o \( \
                    -iname 'Dockerfile*' -o -iname '*.dockerfile' \
                    -o -iname 'docker-compose*.yml' -o -iname 'docker-compose*.yaml' \
                    -o -iname 'compose.y*ml' -o -name '.dockerignore' -o -name '.devcontainer' \
                  \) -print)
          if [ -n "$found" ]; then
            echo "ERROR: container artefacts present — see docs/DECISIONS.md"
            echo "$found"
            exit 1
          fi
          echo "clean"

      - name: No container tooling invoked
        run: |
          if grep -rnE '(^|[^[:alnum:]_-])(docker[[:space:]]+(run|build|compose|exec|pull|push)|docker-compose[[:space:]]|kubectl[[:space:]]|helm[[:space:]]+(install|upgrade|template))' \
               --include='*.py' --include='*.yml' --include='*.yaml' --include='*.toml' \
               --include='*.sh' --include='*.service' --include='Makefile' --include='Caddyfile' \
               --exclude-dir=.git --exclude-dir=.venv --exclude-dir=docs \
               --exclude-dir=.github . ; then
            echo "ERROR: container tooling invoked outside docs/ — see docs/DECISIONS.md"
            exit 1
          fi
          echo "clean"

  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # test_readonly_role.py skips with an explicit message here (no DATABASE_URL_RO on a
      # runner). That is expected and visible in the report; it never silently passes.
      - name: Pytest
        run: pytest -q --junitxml=report.xml

      - name: Agent loop, offline
        run: python -m eval.harness.runner --demo --offline

      - name: Evaluation harness, offline
        run: python -m eval.harness.runner --config eval/configs/baseline.yaml --offline

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            report.xml
            eval/results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # A distinct job on purpose: a red-team regression must be legible as a security failure in
      # the checks list, not buried among unit tests.
      - name: Red-team test suite
        run: |
          pytest -q \
            tests/test_ast_policy.py \
            tests/test_execute_tool_bypass.py \
            tests/test_max_iterations.py

      - name: Attack dataset must be blocked 100%
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, "src")
          from eval.harness.metrics import security_metrics
          from eval.harness.runner import REPO_ROOT, run_security_suite

          m = security_metrics(run_security_suite(REPO_ROOT / "eval/datasets/security/attacks.jsonl"))
          print(json.dumps(m, indent=2))
          if m["pass_rate"] != 100.0:
              print(f"FAIL: security pass rate {m['pass_rate']}%, failures: {m['failures']}")
              sys.exit(1)
          print(f"OK: {m['n_cases']} SQL cases, 100% as expected")
          PY

  # ---------------------------------------------------------------------------
  deploy:
    needs: [lint, test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://t2sql.example.com
    steps:
      # SSH_PRIVATE_KEY, VPS_HOST, VPS_USER and SSH_KNOWN_HOSTS are repository secrets.
      # SSH_KNOWN_HOSTS pins the host key — without it, StrictHostKeyChecking would either
      # block the deploy or (worse) be disabled, which is a silent man-in-the-middle window.
      #   ssh-keyscan -H <vps-host>     # to generate the value
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/t2sql
          sudo -u t2sql git pull --ff-only
          sudo -u t2sql /opt/t2sql/.venv/bin/pip install -e . --quiet
          sudo systemctl restart t2sql-api t2sql-ui
          sleep 5
          curl -fsS localhost:8000/health
          REMOTE
